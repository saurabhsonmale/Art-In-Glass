# Render Blueprint — Art In Glass API
# Live URL: https://art-in-glass.onrender.com
services:
  - type: web
    name: art-in-glass
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://art-in-glass.onrender.com
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_NAME
        value: resin_art_db
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PYTHON_VERSION
        value: "3.11.11"
